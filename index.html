<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ЕГЭ Обществознание · Человек и общество</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f5f6fa; --card:#fff; --text:#1a1d29; --muted:#7a8194;
    --border:#e7e9f0; --primary:#6366f1; --primary2:#8b5cf6;
    --success:#10b981; --error:#ef4444; --warn:#f59e0b; --info:#3b82f6;
    --radius:18px; --shadow:0 4px 20px rgba(20,25,60,.06);
  }
  [data-theme="dark"]{
    --bg:#0f1220; --card:#1a1f35; --text:#e8ebf5; --muted:#8a92ab;
    --border:#2a3050; --shadow:0 4px 20px rgba(0,0,0,.3);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
  .app{max-width:820px;margin:0 auto;padding:16px}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--card);
    border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);
    margin-bottom:14px;position:sticky;top:8px;z-index:50}
  .pet-mini{width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
  .info{flex:1;min-width:0}
  .info .name{font-weight:700;font-size:14px}
  .info .bar{height:6px;background:var(--border);border-radius:3px;margin-top:4px;overflow:hidden}
  .info .bar div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));
    border-radius:3px;transition:width .5s;width:0}
  .icons{display:flex;gap:6px}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--bg);
    cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
    transition:all .2s;color:var(--text)}
  .icon-btn:hover{background:var(--border);transform:scale(1.08)}
  .icon-btn.off{opacity:.35}
  .screen{display:none;animation:fadeIn .35s ease}
  .screen.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border-radius:var(--radius);padding:20px;
    box-shadow:var(--shadow);margin-bottom:14px}
  h1{font-size:24px;margin-bottom:6px;letter-spacing:-.3px}
  h2{font-size:18px;margin-bottom:12px;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.5}
  .animal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .animal-card{border:2px solid var(--border);border-radius:16px;padding:18px;
    text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
  .animal-card:hover{border-color:var(--primary);transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(99,102,241,.15)}
  .animal-card .emoji{font-size:52px;display:block;margin-bottom:8px;
    animation:breathe 3s ease-in-out infinite}
  .animal-card .name{font-weight:700;font-size:15px}
  .animal-card .desc{font-size:12px;color:var(--muted);margin-top:3px}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .pet-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    border-radius:var(--radius);padding:20px;margin-bottom:14px;
    position:relative;overflow:hidden}
  .pet-hero::before{content:'';position:absolute;top:-50%;right:-50%;
    width:200%;height:200%;
    background:radial-gradient(circle,rgba(255,255,255,.4),transparent 60%);
    animation:shine 6s ease-in-out infinite}
  @keyframes shine{0%,100%{transform:translate(-30%,-30%)}50%{transform:translate(-10%,-10%)}}
  .pet-hero>*{position:relative;z-index:1}
  .pet-big{width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#fef3c7);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 25px rgba(251,191,36,.5),0 8px 20px rgba(0,0,0,.1);
    flex-shrink:0;font-size:64px;animation:breathe 4s ease-in-out infinite;
    transition:font-size .5s cubic-bezier(.34,1.56,.64,1)}
  .pet-info{flex:1;min-width:180px}
  .pet-info .pname{font-size:20px;font-weight:800;color:#78350f}
  .pet-info .pstage{font-size:13px;color:#92400e;font-weight:700;margin:2px 0 10px}
  .pet-info .pbar{height:8px;background:rgba(255,255,255,.6);border-radius:4px;overflow:hidden}
  .pet-info .pbar div{height:100%;background:linear-gradient(90deg,#f59e0b,#ea580c);
    border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1)}
  .pet-info .pxp{font-size:12px;color:#78350f;font-weight:600;margin-top:6px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;
    box-shadow:var(--shadow)}
  .stat .em{font-size:18px;margin-bottom:2px;display:block}
  .stat b{font-size:18px;display:block;letter-spacing:-.5px}
  .stat small{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;font-weight:600}
  .tabs{display:flex;gap:4px;background:var(--card);border-radius:14px;
    padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
  .tab{flex:1;padding:10px 6px;border:none;background:transparent;color:var(--muted);
    border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;
    transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tab span{font-size:16px}
  .tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
  .tab:hover:not(.active){color:var(--text)}
  .block-head{display:flex;align-items:center;gap:12px;background:var(--card);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .block-head .ic{font-size:26px}
  .block-head .tt{flex:1}
  .block-head .tt b{font-size:16px;display:block}
  .block-head .tt small{font-size:12px;color:var(--muted)}
  .block-head .cnt{font-size:13px;font-weight:800;color:var(--primary);
    background:rgba(99,102,241,.1);padding:6px 12px;border-radius:20px}
  .bilet-row{background:var(--card);border-radius:14px;padding:14px 16px;
    margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;
    display:flex;align-items:center;gap:12px;border-left:4px solid var(--border)}
  .bilet-row:hover{transform:translateX(4px);box-shadow:0 8px 20px rgba(99,102,241,.15);
    border-left-color:var(--primary)}
  .bilet-row.done{border-left-color:var(--success);
    background:linear-gradient(135deg,rgba(16,185,129,.05),transparent)}
  .bilet-row .num{width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;
    font-size:14px;flex-shrink:0}
  .bilet-row.done .num{background:var(--success)}
  .bilet-row .body{flex:1;min-width:0}
  .bilet-row .body .title{font-weight:700;font-size:14.5px;margin-bottom:3px}
  .bilet-row .body .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .bilet-row .body .meta span{display:inline-flex;align-items:center;gap:4px}
  .bilet-row .arrow{font-size:18px;color:var(--muted);flex-shrink:0}
  .study-card{background:var(--card);border-radius:var(--radius);padding:18px;
    margin-bottom:14px;box-shadow:var(--shadow)}
  .study-block{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .study-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .study-block .type{display:inline-block;font-size:11px;font-weight:800;
    padding:3px 10px;border-radius:20px;margin-bottom:8px;letter-spacing:.3px;
    text-transform:uppercase}
  .type.признаки{background:rgba(99,102,241,.15);color:#6366f1}
  .type.теория{background:rgba(59,130,246,.15);color:#3b82f6}
  .type.реалии{background:rgba(239,68,68,.15);color:#ef4444}
  .type.обоснование{background:rgba(245,158,11,.15);color:#f59e0b}
  .type.план{background:rgba(16,185,129,.15);color:#10b981}
  .type.науки{background:rgba(139,92,246,.15);color:#8b5cf6}
  .study-block .q{font-weight:700;font-size:15px;margin-bottom:10px;line-height:1.4}
  .study-block ul{list-style:none;padding:0}
  .study-block li{padding:8px 12px 8px 28px;position:relative;margin-bottom:5px;
    background:var(--bg);border-radius:10px;font-size:13.5px;line-height:1.5}
  .study-block li::before{content:'•';position:absolute;left:12px;
    color:var(--primary);font-weight:900;font-size:16px}
  .quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .quiz-header .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .quiz-header .bar div{height:100%;
    background:linear-gradient(90deg,var(--primary),var(--primary2));
    border-radius:4px;transition:width .3s;width:0}
  .quiz-header .cnt{font-size:13px;color:var(--muted);font-weight:700;
    min-width:40px;text-align:right}
  .quiz-q{font-size:18px;line-height:1.4;margin-bottom:18px;font-weight:700;letter-spacing:-.2px}
  .options{display:flex;flex-direction:column;gap:10px}
  .option{padding:14px 16px;border-radius:12px;border:2px solid var(--border);
    background:var(--card);cursor:pointer;font-size:15px;text-align:left;
    transition:all .15s;font-family:inherit;color:var(--text);font-weight:500;line-height:1.4}
  .option:hover:not(:disabled){border-color:var(--primary);
    background:rgba(99,102,241,.05);transform:translateX(4px)}
  .option:disabled{cursor:default}
  .option.correct{border-color:var(--success);background:rgba(16,185,129,.12);
    font-weight:700;color:var(--success)}
  .option.wrong{border-color:var(--error);background:rgba(239,68,68,.1);
    font-weight:700;color:var(--error)}
  .explain{margin-top:14px;padding:14px;border-radius:12px;
    background:rgba(245,158,11,.1);border-left:4px solid var(--warn);
    font-size:13.5px;line-height:1.55}
  .explain.hidden{display:none}
  .btn{padding:13px 20px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;
    font-family:inherit;box-shadow:0 4px 15px rgba(99,102,241,.3);
    display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.4)}
  .btn-full{width:100%;margin-top:16px}
  .btn-ghost{background:var(--bg);color:var(--text);box-shadow:none;
    border:1.5px solid var(--border)}
  .btn-ghost:hover{background:var(--border);box-shadow:none}
  .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow:0 4px 15px rgba(239,68,68,.3)}
  .result{text-align:center;padding:32px 20px}
  .result .em{font-size:72px;margin-bottom:8px;display:inline-block;
    animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .result h2{font-size:22px;margin-bottom:6px}
  .result p{color:var(--muted);margin-bottom:20px;font-size:14px}
  .result .stats-inline{display:flex;justify-content:center;gap:24px;margin-bottom:20px}
  .result .stats-inline div{text-align:center}
  .result .stats-inline b{font-size:22px;display:block;color:var(--primary)}
  .result .stats-inline small{font-size:11px;color:var(--muted);text-transform:uppercase}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:200;
    animation:fadeIn .25s;padding:20px}
  .overlay .modal{background:var(--card);border-radius:24px;padding:32px 24px;
    text-align:center;max-width:340px;width:100%;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  .overlay .modal .em{font-size:80px;margin-bottom:12px;display:inline-block;
    animation:breathe 1.5s infinite}
  .overlay .modal h3{font-size:20px;margin-bottom:6px;color:var(--primary)}
  .overlay .modal p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:20px}
  .ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ach{background:var(--card);border-radius:14px;padding:14px;display:flex;gap:12px;
    align-items:center;box-shadow:var(--shadow);border:2px solid transparent;transition:all .2s}
  .ach.locked{opacity:.5;filter:grayscale(1)}
  .ach.unlocked{border-color:var(--success);
    background:linear-gradient(135deg,rgba(16,185,129,.06),rgba(16,185,129,.02))}
  .ach .aic{font-size:28px;flex-shrink:0}
  .ach .ainfo{min-width:0}
  .ach .atitle{font-weight:800;font-size:13px;margin-bottom:2px}
  .ach .adesc{font-size:11px;color:var(--muted);line-height:1.3}
  .exam-timer{display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--card);padding:16px;border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:14px}
  .exam-timer .t{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-1px;color:var(--primary)}
  .exam-timer .t.warn{color:var(--error);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .setting-row{display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;border-bottom:1px solid var(--border)}
  .setting-row:last-child{border-bottom:none}
  .setting-row .lbl{font-weight:600;font-size:14px}
  .setting-row .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .switch{width:46px;height:26px;border-radius:14px;background:var(--border);
    position:relative;cursor:pointer;transition:background .2s;border:none}
  .switch.on{background:var(--primary)}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
    border-radius:50%;background:#fff;transition:transform .2s;
    box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .switch.on::after{transform:translateX(20px)}
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .back-row .back-btn{width:38px;height:38px;border-radius:12px;border:none;
    background:var(--card);cursor:pointer;font-size:18px;box-shadow:var(--shadow);
    color:var(--text);display:flex;align-items:center;justify-content:center}
  .back-row .back-btn:hover{background:var(--border)}
  .back-row .title{flex:1;font-weight:800;font-size:17px}
  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .animal-grid{gap:8px}
    .animal-card{padding:14px}
    .animal-card .emoji{font-size:42px}
    .ach-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar" id="topbar" style="display:none">
    <div class="pet-mini" id="petMini">🐱</div>
    <div class="info">
      <div class="name" id="topName">Кот · Малыш</div>
      <div class="bar"><div id="topProgress"></div></div>
    </div>
    <div class="icons">
      <button class="icon-btn" id="soundBtn">🔊</button>
      <button class="icon-btn" id="themeBtn">🌙</button>
    </div>
  </div>

  <div id="screen-start" class="screen active">
    <div class="card">
      <h1>🐾 Выбери питомца</h1>
      <p class="sub">Он растёт вместе с твоими знаниями. Чем больше XP — тем сильнее питомец.</p>
      <div class="animal-grid" id="animalGrid"></div>
    </div>
  </div>

  <div id="screen-home" class="screen">
    <div class="pet-hero">
      <div class="pet-big" id="petBig">🐱</div>
      <div class="pet-info">
        <div class="pname" id="petName">Кот</div>
        <div class="pstage" id="petStage">Малыш</div>
        <div class="pbar"><div id="petProgress"></div></div>
        <div class="pxp" id="petXp">0 / 100 XP</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="em">🔥</span><b id="statStreak">0</b><small>стрик</small></div>
      <div class="stat"><span class="em">⭐</span><b id="statXp">0</b><small>XP</small></div>
      <div class="stat"><span class="em">📚</span><b id="statLessons">0</b><small>уроков</small></div>
      <div class="stat"><span class="em">🏆</span><b id="statAch">0</b><small>награды</small></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="lessons"><span>📚</span>Уроки</button>
      <button class="tab" data-tab="exam"><span>⏱️</span>Экзамен</button>
      <button class="tab" data-tab="ach"><span>🏆</span>Награды</button>
      <button class="tab" data-tab="settings"><span>⚙️</span>Ещё</button>
    </div>

    <div id="tab-lessons" class="tab-content"></div>
    <div id="tab-exam" class="tab-content" style="display:none"></div>
    <div id="tab-ach" class="tab-content" style="display:none"></div>
    <div id="tab-settings" class="tab-content" style="display:none"></div>
  </div>

  <!-- ЭКРАН ТЕОРИИ -->
  <div id="screen-study" class="screen">
    <div class="back-row">
      <button class="back-btn" id="studyBack">←</button>
      <div class="title" id="studyTitle">Билет 1</div>
    </div>
    <div id="studyContent"></div>
    <button class="btn btn-full" id="studyStartQuiz">🎯 Пройти квиз по билету</button>
  </div>

  <!-- ЭКРАН КВИЗА -->
  <div id="screen-quiz" class="screen">
    <div class="card">
      <div class="quiz-header">
        <button class="icon-btn" id="quizBack">←</button>
        <div class="bar"><div id="quizProgress"></div></div>
        <div class="cnt" id="quizCount">1/5</div>
      </div>
      <div class="quiz-q" id="quizQ">Вопрос</div>
      <div class="options" id="quizOptions"></div>
      <div class="explain hidden" id="quizExplain"></div>
      <button class="btn btn-full" id="quizNext" style="display:none">Далее →</button>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="card result">
      <div class="em" id="resultEm">🎉</div>
      <h2 id="resultTitle">Отлично!</h2>
      <p id="resultSub">Ты заработал +0 XP</p>
      <div class="stats-inline" id="resultStats"></div>
      <button class="btn btn-full" id="resultNext">Продолжить</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   ЖИВОТНЫЕ
   ============================================================ */
const ANIMALS = {
  cat:    { name:'Кот',    desc:'Любопытный и хитрый',       emoji:['🐱','🐈','🐈‍⬛','🦁','🐯'] },
  dog:    { name:'Пёс',    desc:'Верный и настойчивый',      emoji:['🐶','🐕','🐕‍🦺','🐺','🦮'] },
  owl:    { name:'Сова',   desc:'Мудрая и внимательная',     emoji:['🥚','🐣','🐥','🦉','🦅'] },
  dragon: { name:'Дракон', desc:'Растёт в силе и знаниях',   emoji:['🥚','🦎','🐊','🐉','🐲'] },
  fox:    { name:'Лис',    desc:'Сообразительный и быстрый', emoji:['🦊','🐺','🐕','🐆','🐅'] },
  panda:  { name:'Панда',  desc:'Спокойная и усидчивая',     emoji:['🥚','🐻','🐼','🐨','🦣'] }
};
const STAGES = [
  { xp:0,    label:'Малыш',    scale:1.00 },
  { xp:100,  label:'Растёт',   scale:1.12 },
  { xp:300,  label:'Юный',     scale:1.24 },
  { xp:700,  label:'Взрослый', scale:1.36 },
  { xp:1500, label:'Мудрый',   scale:1.50 }
];

/* ============================================================
   БИЛЕТЫ ЧвО — теперь это УРОКИ игры
   Каждый билет = теория (blocks) + квиз (questions)
   ============================================================ */
const CHVO = [
  {
    id: 1, title: 'Билет 1',
    icon: '🧠',
    short: 'Личность · истина · деятельность · глобализация',
    blocks: [
      { type:'признаки', q:'Признаки личности', a:[
        'совокупность социально значимых качеств',

const $ = id => document.getElementById(id);
function showScreen(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + n).classList.add('active');
  $('topbar').style.display = n === 'start' ? 'none' : 'flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function getStage(xp) {
  let i = 0;
  for (let k = 0; k < STAGES.length; k++) if (xp >= STAGES[k].xp) i = k;
  return i;
}
function getAnimal() { return ANIMALS[state.animalId] || null; }
function updateStreak() {
  const t = new Date().toDateString();
  if (state.lastVisit === t) return;
  const y = new Date(Date.now() - 86400000).toDateString();
  state.streak = state.lastVisit === y ? state.streak + 1 : 1;
  state.lastVisit = t;
  save();
}

/* ============================================================
   ЗВУКИ
   ============================================================ */
let ac = null;
function beep(f, d, type = 'sine', v = 0.08, delay = 0) {
  if (!state.sound) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(); const g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch(e){}
}
const SFX = {
  correct: () => { beep(660, .12); beep(880, .15, 'sine', .08, .1); },
  wrong:   () => beep(200, .25, 'sawtooth', .06),
  click:   () => beep(400, .05, 'sine', .04),
  levelup: () => { beep(523, .12); beep(659, .12, 'sine', .1, .1); beep(784, .12, 'sine', .1, .2); beep(1047, .3, 'sine', .12, .3); },
  ach:     () => { beep(880, .1, 'triangle', .1); beep(1100, .2, 'triangle', .1, .1); },
  finish:  () => { beep(600, .1); beep(800, .1, 'sine', .1, .1); beep(1000, .25, 'sine', .1, .2); }
};

/* ============================================================
   ДОСТИЖЕНИЯ
   ============================================================ */
const ACHIEVEMENTS = [
  { id:'first',   icon:'🌱', title:'Первые шаги', desc:'Пройди первый билет',       check: s => Object.keys(s.completed).length >= 1 },
  { id:'perfect', icon:'💯', title:'Отличник',    desc:'100% в одном билете',        check: s => s.perfectOnce },
  { id:'half',    icon:'📚', title:'Половина',    desc:'Пройди 4 билета',            check: s => Object.keys(s.completed).length >= 4 },
  { id:'all',     icon:'🎓', title:'Эрудит ЧвО',  desc:'Пройди все 8 билетов',       check: s => Object.keys(s.completed).length >= 8 },
  { id:'streak7', icon:'🔥', title:'Марафонец',   desc:'Стрик 7 дней',               check: s => s.streak >= 7 },
  { id:'xp500',   icon:'⭐', title:'Знаток',      desc:'500 XP',                     check: s => s.xp >= 500 },
  { id:'xp2000',  icon:'👑', title:'Мастер',      desc:'2000 XP',                    check: s => s.xp >= 2000 },
  { id:'accuracy',icon:'🎯', title:'Снайпер',     desc:'Точность 80%+ (мин. 20)',    check: s => (s.totalCorrect + s.totalWrong) >= 20 && s.totalCorrect / (s.totalCorrect + s.totalWrong) >= 0.8 },
  { id:'exam',    icon:'⏱️', title:'Экзаменатор', desc:'Пройди пробный экзамен',     check: s => s.examPassed },
  { id:'petchange',icon:'🐾', title:'Коллекционер',desc:'Смени питомца',             check: s => s.petChanged }
];
function checkAchievements() {
  const unlocked = [];
  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements[a.id] && a.check(state)) {
      state.achievements[a.id] = Date.now();
      unlocked.push(a);
    }
  });
  if (unlocked.length) {
    save();
    setTimeout(() => { SFX.ach(); showAchPopup(unlocked); }, 600);
  }
}
function showAchPopup(list) {
  const a = list[0];
  const d = document.createElement('div');
  d.className = 'overlay';
  d.innerHTML = `<div class="modal"><div class="em">${a.icon}</div>
    <h3>Достижение!</h3><p><b>${a.title}</b><br>${a.desc}</p>
    <button class="btn btn-full" style="margin:0">Круто!</button></div>`;
  d.querySelector('button').onclick = () => { d.remove(); if (list.length > 1) showAchPopup(list.slice(1)); };
  document.body.appendChild(d);
}

/* ============================================================
   ТЕМА / ЗВУК
   ============================================================ */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  $('themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}
function applySound() {
  $('soundBtn').textContent = state.sound ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('off', !state.sound);
}

/* ============================================================
   ВЫБОР ПИТОМЦА
   ============================================================ */
function renderAnimals() {
  const g = $('animalGrid'); g.innerHTML = '';
  Object.keys(ANIMALS).forEach(id => {
    const a = ANIMALS[id];
    const c = document.createElement('div');
    c.className = 'animal-card';
    c.innerHTML = `<span class="emoji">${a.emoji[0]}</span>
      <div class="name">${a.name}</div><div class="desc">${a.desc}</div>`;
    c.onclick = () => {
      SFX.click();
      if (state.animalId && state.animalId !== id) state.petChanged = true;
      state.animalId = id;
      save();
      updateStreak();
      showScreen('home');
      renderHome();
    };
    g.appendChild(c);
  });
}

/* ============================================================
   ГЛАВНАЯ
   ============================================================ */
function renderHome() {
  const a = getAnimal();
  if (!a) { showScreen('start'); return; }
  const sIdx = getStage(state.xp);
  const stage = STAGES[sIdx];
  const next = STAGES[sIdx + 1];

  $('petBig').textContent = a.emoji[sIdx];
  $('petBig').style.fontSize = (64 * stage.scale) + 'px';
  $('petName').textContent = a.name;
  $('petStage').textContent = 'Стадия: ' + stage.label;

  let pct = 100, xpText;
  if (next) {
    pct = Math.min(100, (state.xp - stage.xp) / (next.xp - stage.xp) * 100);
    xpText = `${state.xp} / ${next.xp} XP до «${next.label}»`;
  } else xpText = `${state.xp} XP — максимум!`;
  $('petProgress').style.width = pct + '%';
  $('petXp').textContent = xpText;

  $('petMini').textContent = a.emoji[sIdx];
  $('topName').textContent = `${a.name} · ${stage.label}`;
  $('topProgress').style.width = pct + '%';

  $('statStreak').textContent = state.streak;
  $('statXp').textContent = state.xp;
  $('statLessons').textContent = Object.keys(state.completed).length;
  $('statAch').textContent = Object.keys(state.achievements).length;

  renderTab('lessons');
}

/* ============================================================
   ТАБЫ
   ============================================================ */
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    SFX.click();
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
    $('tab-' + t.dataset.tab).style.display = 'block';
    renderTab(t.dataset.tab);
  };
});
function renderTab(n) {
  if (n === 'lessons') renderLessons();
  else if (n === 'exam') renderExamTab();
  else if (n === 'ach') renderAch();
  else if (n === 'settings') renderSettings();
}

/* ============================================================
   УРОКИ — это БИЛЕТЫ ЧвО
   ============================================================ */
function renderLessons() {
  const w = $('tab-lessons');
  const done = CHVO.filter(b => state.completed['bilet' + b.id] !== undefined).length;
  w.innerHTML = `
    <div class="block-head">
      <span class="ic">🧠</span>
      <div class="tt"><b>Человек и общество</b><small>Билеты к зачёту · 8 уроков</small></div>
      <span class="cnt">${done}/8</span>
    </div>
  `;
  CHVO.forEach(b => {
    const key = 'bilet' + b.id;
    const best = state.completed[key];
    const isDone = best !== undefined;
    const row = document.createElement('div');
    row.className = 'bilet-row' + (isDone ? ' done' : '');
    row.innerHTML = `
      <div class="num">${isDone ? '✓' : b.id}</div>
      <div class="body">
        <div class="title">${b.icon} ${b.title}</div>
        <div class="meta">
          <span>📖 ${b.blocks.length} блоков теории</span>
          <span>🎯 ${b.questions.length} вопросов</span>
          ${isDone ? `<span>✅ ${best}/${b.questions.length}</span>` : ''}
        </div>
      </div>
      <div class="arrow">›</div>
    `;
    row.onclick = () => { SFX.click(); openStudy(b.id); };
    w.appendChild(row);
  });
}

/* ============================================================
   ЭКРАН ТЕОРИИ
   ============================================================ */
function openStudy(id) {
  const b = CHVO.find(x => x.id === id);
  if (!b) return;
  $('studyTitle').textContent = `${b.icon} ${b.title}`;
  const c = $('studyContent'); c.innerHTML = '';
  b.blocks.forEach(blk => {
    const el = document.createElement('div');
    el.className = 'study-card';
    el.innerHTML = `
      <div class="study-block">
        <div class="type ${blk.type}">${blk.type}</div>
        <div class="q">${blk.q}</div>
        <ul>${blk.a.map(x => '<li>' + x + '</li>').join('')}</ul>
      </div>
    `;
    c.appendChild(el);
  });
  $('studyStartQuiz').onclick = () => { SFX.click(); startBiletQuiz(b.id); };
  showScreen('study');
}

/* ============================================================
   КВИЗ ПО БИЛЕТУ
   ============================================================ */
function startBiletQuiz(id) {
  const b = CHVO.find(x => x.id === id);
  state.quiz = {
    biletId: id,
    questions: b.questions,
    current: 0,
    correct: 0,
    answered: false,
    lessonTitle: b.title + ' — квиз'
  };
  showScreen('quiz');
  renderQuestion();
}
function renderQuestion() {
  const q = state.quiz;
  const question = q.questions[q.current];
  const total = q.questions.length;
  $('quizCount').textContent = (q.current + 1) + '/' + total;
  $('quizProgress').style.width = (q.current / total * 100) + '%';
  $('quizQ').textContent = question.q;
  const o = $('quizOptions'); o.innerHTML = '';
  question.options.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = t;
    btn.onclick = () => answer(i);
    o.appendChild(btn);
  });
  $('quizExplain').classList.add('hidden');
  $('quizNext').style.display = 'none';
  q.answered = false;
}
function answer(sel) {
  const q = state.quiz;
  if (q.answered) return;
  q.answered = true;
  const question = q.questions[q.current];
  const opts = document.querySelectorAll('#quizOptions .option');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === question.correct) btn.classList.add('correct');
    else if (i === sel) btn.classList.add('wrong');
  });
  if (sel === question.correct) { q.correct++; state.totalCorrect++; SFX.correct(); }
  else { state.totalWrong++; SFX.wrong(); }
  const ex = $('quizExplain');
  ex.textContent = '💡 ' + question.explain;
  ex.classList.remove('hidden');
  const nb = $('quizNext');
  nb.style.display = 'flex';
  nb.textContent = (q.current === q.questions.length - 1) ? 'Завершить →' : 'Далее →';
  nb.onclick = nextQuestion;
}
function nextQuestion() {
  const q = state.quiz;
  if (q.current < q.questions.length - 1) { q.current++; renderQuestion(); }
  else finishQuiz();
}
function finishQuiz() {
  const q = state.quiz;
  const total = q.questions.length;
  const xp = q.correct * 10;
  const oldS = getStage(state.xp);
  const key = 'bilet' + q.biletId;
  const prev = state.completed[key] || 0;
  if (q.correct > prev) {
    state.completed[key] = q.correct;
    if (q.correct === total) state.perfectOnce = true;
  }
  state.xp += xp;
  save();
  const newS = getStage(state.xp);
  const pct = q.correct / total;
  let em = '🎉', title = 'Отлично!';
  if (pct < 0.5) { em = '😅'; title = 'Есть куда расти'; }
  else if (pct < 0.8) { em = '👍'; title = 'Хороший результат!'; }
  else if (pct === 1) { em = '🏆'; title = 'Идеально!'; }
  $('resultEm').textContent = em;
  $('resultTitle').textContent = title;
  $('resultSub').textContent = q.lessonTitle;
  $('resultStats').innerHTML = `
    <div><b>${q.correct}/${total}</b><small>верно</small></div>
    <div><b>+${xp}</b><small>XP</small></div>
    <div><b>${state.streak}</b><small>стрик</small></div>`;
  SFX.finish();
  showScreen('result');
  checkAchievements();
  if (newS > oldS) setTimeout(() => showLevelUp(newS), 700);
}
function showLevelUp(s) {
  const a = getAnimal();
  const st = STAGES[s];
  const d = document.createElement('div');
  d.className = 'overlay';
  d.innerHTML = `<div class="modal"><div class="em">${a.emoji[s]}</div>
    <h3>Новая стадия: ${st.label}!</h3>
    <p>Твой ${a.name.toLowerCase()} подрос. Продолжай!</p>
    <button class="btn btn-full" style="margin:0">Ура!</button></div>`;
  d.querySelector('button').onclick = () => d.remove();
  document.body.appendChild(d);
  SFX.levelup();
}

/* ============================================================
   ЭКЗАМЕН
   ============================================================ */
function renderExamTab() {
  const w = $('tab-exam');
  const accuracy = state.totalCorrect + state.totalWrong ?
    Math.round(state.totalCorrect / (state.totalCorrect + state.totalWrong) * 100) : 0;
  w.innerHTML = `
    <div class="card">
      <h2>⏱️ Пробный экзамен</h2>
      <p class="sub">10 случайных вопросов из всех билетов. Таймер — 5 минут. +15 XP за верный ответ.</p>
      <button class="btn btn-full" id="startExamBtn" style="margin:0">Начать экзамен</button>
    </div>
    <div class="card">
      <h2>📊 Статистика</h2>
      <div class="stats" style="margin:0">
        <div class="stat"><span class="em">✅</span><b>${state.totalCorrect}</b><small>верных</small></div>
        <div class="stat"><span class="em">❌</span><b>${state.totalWrong}</b><small>ошибок</small></div>
        <div class="stat"><span class="em">🎯</span><b>${accuracy}%</b><small>точность</small></div>
        <div class="stat"><span class="em">🔥</span><b>${state.streak}</b><small>стрик</small></div>
      </div>
    </div>`;
  $('startExamBtn').onclick = () => { SFX.click(); startExam(); };
}
function startExam() {
  const all = [];
  CHVO.forEach(b => b.questions.forEach(q => all.push(q)));
  const sh = all.sort(() => Math.random() - 0.5).slice(0, 10);
  state.exam = {
    questions: sh, current: 0, correct: 0, answered: false,
    timeLeft: 300, timer: null, lessonTitle: 'Пробный экзамен'
  };
  const t = document.createElement('div');
  t.className = 'exam-timer';
  t.innerHTML = `<span>⏱️</span><span class="t" id="examTimer">05:00</span>`;
  const c = $('screen-quiz').querySelector('.card');
  c.insertBefore(t, c.firstChild);
  showScreen('quiz');
  renderQuestion();
  state.exam.timer = setInterval(() => {
    state.exam.timeLeft--;
    const m = Math.floor(state.exam.timeLeft / 60);
    const s = state.exam.timeLeft % 60;
    const el = $('examTimer');
    if (!el) return;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (state.exam.timeLeft <= 60) el.classList.add('warn');
    if (state.exam.timeLeft <= 0) { clearInterval(state.exam.timer); finishExam(true); }
  }, 1000);
}
function finishExam(timeUp) {
  if (state.exam.timer) clearInterval(state.exam.timer);
  const q = state.exam;
  const total = q.questions.length;
  const xp = q.correct * 15;
  state.xp += xp;
  state.totalCorrect += q.correct;
  state.totalWrong += (q.current + 1) - q.correct;
  state.examPassed = true;
  save();
  const t = $('examTimer'); if (t) t.parentElement.remove();
  const pct = q.correct / total;
  let em = '🎉', title = 'Экзамен сдан!';
  if (timeUp) { em = '⏰'; title = 'Время вышло!'; }
  else if (pct < 0.5) { em = '😅'; title = 'Пока слабовато'; }
  else if (pct < 0.8) { em = '👍'; title = 'Хороший результат!'; }
  else if (pct === 1) { em = '🏆'; title = 'Идеально!'; }
  $('resultEm').textContent = em;
  $('resultTitle').textContent = title;
  $('resultSub').textContent = 'Пробный экзамен';
  $('resultStats').innerHTML = `
    <div><b>${q.correct}/${total}</b><small>верно</small></div>
    <div><b>+${xp}</b><small>XP</small></div>
    <div><b>${Math.round(pct * 100)}%</b><small>результат</small></div>`;
  SFX.finish();
  showScreen('result');
  checkAchievements();
}

/* ============================================================
   ДОСТИЖЕНИЯ
   ============================================================ */
function renderAch() {
  const w = $('tab-ach');
  const u = Object.keys(state.achievements).length;
  w.innerHTML = `<div class="card"><h2>🏆 Достижения</h2>
    <p class="sub">Открыто ${u} из ${ACHIEVEMENTS.length}</p>
    <div class="ach-grid" id="achGrid"></div></div>`;
  const g = $('achGrid');
  ACHIEVEMENTS.forEach(a => {
    const un = !!state.achievements[a.id];
    const el = document.createElement('div');
    el.className = 'ach ' + (un ? 'unlocked' : 'locked');
    el.innerHTML = `<div class="aic">${a.icon}</div>
      <div class="ainfo"><div class="atitle">${a.title}</div>
      <div class="adesc">${a.desc}</div></div>`;
    g.appendChild(el);
  });
}

/* ============================================================
   НАСТРОЙКИ
   ============================================================ */
function renderSettings() {
  const w = $('tab-settings');
  w.innerHTML = `
    <div class="card"><h2>⚙️ Настройки</h2>
      <div class="setting-row">
        <div><div class="lbl">🔊 Звуки</div><div class="sub">Клики и ответы</div></div>
        <button class="switch ${state.sound ? 'on' : ''}" id="setSound"></button>
      </div>
      <div class="setting-row">
        <div><div class="lbl">🌙 Тёмная тема</div><div class="sub">Для вечерних занятий</div></div>
        <button class="switch ${state.theme === 'dark' ? 'on' : ''}" id="setTheme"></button>
      </div>
    </div>
    <div class="card"><h2>💾 Прогресс</h2>
      <p class="sub">Экспорт/импорт для переноса между устройствами.</p>
      <button class="btn btn-ghost btn-full" id="exportBtn" style="margin-bottom:8px">📤 Экспорт</button>
      <label class="btn btn-ghost btn-full" style="cursor:pointer;margin-bottom:8px">
        📥 Импорт <input type="file" id="importFile" accept=".json" style="display:none">
      </label>
      <button class="btn btn-danger btn-full" id="resetBtn">🗑 Сбросить всё</button>
    </div>
    <div class="card"><h2>ℹ️ О приложении</h2>
      <p class="sub" style="margin:0">Тренажёр по блоку «Человек в обществе» для подготовки к ЕГЭ. 8 билетов, ${CHVO.reduce((n,b) => n + b.questions.length, 0)} вопросов, ${CHVO.reduce((n,b) => n + b.blocks.length, 0)} блоков теории.</p>
    </div>`;
  $('setSound').onclick = () => { state.sound = !state.sound; save(); applySound(); SFX.click(); renderSettings(); };
  $('setTheme').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); SFX.click(); renderSettings(); };
  $('exportBtn').onclick = () => {
    const b = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = 'ege-chvo-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(u); SFX.click();
  };
  $('importFile').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        state = Object.assign(state, JSON.parse(r.result));
        save(); applyTheme(); applySound(); renderHome(); renderSettings();
        alert('Прогресс загружен!');
      } catch(err) { alert('Ошибка файла'); }
    };
    r.readAsText(f);
  };
  $('resetBtn').onclick = () => {
    if (confirm('Сбросить ВЕСЬ прогресс?')) { localStorage.removeItem(KEY); location.reload(); }
  };
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
$('studyBack').onclick = () => { SFX.click(); showScreen('home'); renderHome(); };
$('quizBack').onclick = () => {
  if (confirm('Выйти? Прогресс не сохранится.')) {
    if (state.exam && state.exam.timer) clearInterval(state.exam.timer);
    const t = $('examTimer'); if (t) t.parentElement.remove();
    state.exam = null;
    showScreen('home'); renderHome();
  }
};
$('resultNext').onclick = () => {
  state.exam = null;
  showScreen('home'); renderHome();
};
$('soundBtn').onclick = () => { state.sound = !state.sound; save(); applySound(); SFX.click(); };
$('themeBtn').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); SFX.click(); };

/* ============================================================
   INIT
   ============================================================ */
function init() {
  load();
  applyTheme();
  applySound();
  renderAnimals();
  if (state.animalId && ANIMALS[state.animalId]) {
    updateStreak();
    showScreen('home');
    renderHome();
  } else {
    showScreen('start');
  }
}
init();
</script>
</body>
</html>
