<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ЕГЭ Обществознание · Человек в обществе</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f5f6fa; --card:#fff; --text:#1a1d29; --muted:#7a8194;
    --border:#e7e9f0; --primary:#6366f1; --primary2:#8b5cf6;
    --success:#10b981; --error:#ef4444; --warn:#f59e0b; --info:#3b82f6;
    --radius:18px; --shadow:0 4px 20px rgba(20,25,60,.06);
    --shadow-lg:0 20px 50px rgba(20,25,60,.15);
  }
  [data-theme="dark"]{
    --bg:#0f1220; --card:#1a1f35; --text:#e8ebf5; --muted:#8a92ab;
    --border:#2a3050; --shadow:0 4px 20px rgba(0,0,0,.3);
    --shadow-lg:0 20px 50px rgba(0,0,0,.5);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    transition:background .3s,color .3s;padding-bottom:80px;
  }
  .app{max-width:820px;margin:0 auto;padding:16px}

  /* --- Хедер --- */
  .topbar{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border-radius:var(--radius);
    padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px;
    position:sticky;top:8px;z-index:50;
  }
  .topbar .pet-mini{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;flex-shrink:0;
  }
  .topbar .info{flex:1;min-width:0}
  .topbar .name{font-weight:700;font-size:14px}
  .topbar .bar{height:6px;background:var(--border);border-radius:3px;margin-top:4px;overflow:hidden}
  .topbar .bar div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));
    border-radius:3px;transition:width .5s;width:0}
  .topbar .icons{display:flex;gap:6px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:none;
    background:var(--bg);cursor:pointer;font-size:17px;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;color:var(--text);
  }
  .icon-btn:hover{background:var(--border);transform:scale(1.08)}
  .icon-btn.off{opacity:.35}

  /* --- Экраны --- */
  .screen{display:none;animation:fadeIn .35s ease}
  .screen.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border-radius:var(--radius);padding:20px;
    box-shadow:var(--shadow);margin-bottom:14px;
  }
  h1{font-size:24px;margin-bottom:6px;letter-spacing:-.3px}
  h2{font-size:18px;margin-bottom:12px;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.5}

  /* --- Выбор питомца --- */
  .animal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .animal-card{
    border:2px solid var(--border);border-radius:16px;padding:18px;text-align:center;
    cursor:pointer;transition:all .2s;background:var(--bg);
  }
  .animal-card:hover{border-color:var(--primary);transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(99,102,241,.15)}
  .animal-card .emoji{font-size:52px;display:block;margin-bottom:8px;
    animation:breathe 3s ease-in-out infinite}
  .animal-card .name{font-weight:700;font-size:15px}
  .animal-card .desc{font-size:12px;color:var(--muted);margin-top:3px}

  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* --- Питомец --- */
  .pet-hero{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    border-radius:var(--radius);padding:20px;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .pet-hero::before{
    content:'';position:absolute;top:-50%;right:-50%;
    width:200%;height:200%;
    background:radial-gradient(circle,rgba(255,255,255,.4),transparent 60%);
    animation:shine 6s ease-in-out infinite;
  }
  @keyframes shine{0%,100%{transform:translate(-30%,-30%)}50%{transform:translate(-10%,-10%)}}
  .pet-hero>*{position:relative;z-index:1}
  .pet-big{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#fef3c7);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 25px rgba(251,191,36,.5),0 8px 20px rgba(0,0,0,.1);
    flex-shrink:0;font-size:64px;
    animation:breathe 4s ease-in-out infinite;
    transition:font-size .5s cubic-bezier(.34,1.56,.64,1);
  }
  .pet-info{flex:1;min-width:180px}
  .pet-info .pname{font-size:20px;font-weight:800;color:#78350f}
  .pet-info .pstage{font-size:13px;color:#92400e;font-weight:700;margin:2px 0 10px}
  .pet-info .pbar{height:8px;background:rgba(255,255,255,.6);border-radius:4px;overflow:hidden}
  .pet-info .pbar div{height:100%;background:linear-gradient(90deg,#f59e0b,#ea580c);
    border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1)}
  .pet-info .pxp{font-size:12px;color:#78350f;font-weight:600;margin-top:6px}

  /* --- Статистика --- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;
    box-shadow:var(--shadow)}
  .stat .em{font-size:18px;margin-bottom:2px;display:block}
  .stat b{font-size:18px;display:block;letter-spacing:-.5px}
  .stat small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

  /* --- Табы --- */
  .tabs{
    display:flex;gap:4px;background:var(--card);border-radius:14px;
    padding:4px;box-shadow:var(--shadow);margin-bottom:14px;
  }
  .tab{
    flex:1;padding:10px 6px;border:none;background:transparent;
    color:var(--muted);border-radius:10px;cursor:pointer;
    font-weight:700;font-size:13px;font-family:inherit;
    transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .tab span{font-size:16px}
  .tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
    box-shadow:0 4px 12px rgba(99,102,241,.3)}
  .tab:hover:not(.active){color:var(--text)}

  /* --- Темы (уроки) --- */
  .topic{background:var(--card);border-radius:var(--radius);padding:16px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .topic-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .topic-head .ic{font-size:26px}
  .topic-head .tt{font-weight:800;font-size:16px;flex:1}
  .topic-head .cnt{font-size:12px;color:var(--muted);font-weight:700;
    background:var(--bg);padding:4px 10px;border-radius:20px}
  .lessons{display:flex;flex-direction:column;gap:7px}
  .lesson{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:12px;background:var(--bg);
    cursor:pointer;transition:all .2s;border:2px solid transparent;
  }
  .lesson:hover{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.2);
    transform:translateX(4px)}
  .lesson.done{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3)}
  .lesson-num{
    width:30px;height:30px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;flex-shrink:0;color:var(--primary);
  }
  .lesson.done .lesson-num{background:var(--success);color:#fff}
  .lesson-title{flex:1;font-weight:600;font-size:13.5px;line-height:1.3}
  .lesson-score{font-size:11px;color:var(--muted);font-weight:700}

  /* --- Билеты --- */
  .bilet-card{background:var(--card);border-radius:var(--radius);padding:20px;
    margin-bottom:14px;box-shadow:var(--shadow)}
  .bilet-head{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bilet-head h3{font-size:17px;font-weight:800}
  .bilet-head .badge{font-size:11px;font-weight:700;padding:4px 10px;
    border-radius:20px;background:var(--bg);color:var(--muted)}
  .bilet-head .badge.done{background:rgba(16,185,129,.15);color:var(--success)}
  .qa{margin-bottom:16px}
  .qa:last-child{margin-bottom:0}
  .qa .q{
    display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;
    font-weight:700;font-size:14px;line-height:1.4;
  }
  .qa .q .num{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;width:22px;height:22px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;flex-shrink:0;margin-top:1px;
  }
  .qa .a{
    background:var(--bg);border-radius:12px;padding:12px 14px;
    font-size:13.5px;line-height:1.55;color:var(--text);
    border-left:3px solid var(--primary);
    display:none;
  }
  .qa .a.show{display:block;animation:slideDown .3s ease}
  @keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  .qa .a ul{list-style:none;padding:0}
  .qa .a li{padding-left:14px;position:relative;margin-bottom:5px}
  .qa .a li:last-child{margin-bottom:0}
  .qa .a li::before{content:'•';position:absolute;left:0;color:var(--primary);font-weight:900}
  .toggle-btn{
    margin-top:8px;padding:8px 14px;border-radius:10px;
    border:1.5px solid var(--border);background:transparent;
    color:var(--primary);font-weight:700;font-size:12px;
    cursor:pointer;font-family:inherit;transition:all .2s;
  }
  .toggle-btn:hover{background:rgba(99,102,241,.08);border-color:var(--primary)}

  /* --- Достижения --- */
  .ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ach{
    background:var(--card);border-radius:14px;padding:14px;
    display:flex;gap:12px;align-items:center;
    box-shadow:var(--shadow);border:2px solid transparent;
    transition:all .2s;
  }
  .ach.locked{opacity:.5;filter:grayscale(1)}
  .ach.unlocked{border-color:var(--success);
    background:linear-gradient(135deg,rgba(16,185,129,.06),rgba(16,185,129,.02))}
  .ach .aic{font-size:28px;flex-shrink:0}
  .ach .ainfo{min-width:0}
  .ach .atitle{font-weight:800;font-size:13px;margin-bottom:2px}
  .ach .adesc{font-size:11px;color:var(--muted);line-height:1.3}

  /* --- Экзамен --- */
  .exam-timer{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--card);padding:16px;border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:14px;
  }
  .exam-timer .t{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-1px;color:var(--primary)}
  .exam-timer .t.warn{color:var(--error);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* --- Квиз --- */
  .quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .quiz-header .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .quiz-header .bar div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));
    border-radius:4px;transition:width .3s;width:0}
  .quiz-header .cnt{font-size:13px;color:var(--muted);font-weight:700;min-width:40px;text-align:right}
  .quiz-q{font-size:19px;line-height:1.4;margin-bottom:18px;font-weight:700;letter-spacing:-.2px}
  .options{display:flex;flex-direction:column;gap:10px}
  .option{
    padding:14px 16px;border-radius:12px;border:2px solid var(--border);
    background:var(--card);cursor:pointer;font-size:15px;text-align:left;
    transition:all .15s;font-family:inherit;color:var(--text);
    font-weight:500;line-height:1.4;
  }
  .option:hover:not(:disabled){border-color:var(--primary);background:rgba(99,102,241,.05);
    transform:translateX(4px)}
  .option:disabled{cursor:default}
  .option.correct{border-color:var(--success);background:rgba(16,185,129,.12);
    font-weight:700;color:var(--success)}
  .option.wrong{border-color:var(--error);background:rgba(239,68,68,.1);
    font-weight:700;color:var(--error)}
  .explain{
    margin-top:14px;padding:14px;border-radius:12px;
    background:rgba(245,158,11,.1);border-left:4px solid var(--warn);
    font-size:13.5px;line-height:1.55;
  }
  .explain.hidden{display:none}

  /* --- Кнопки --- */
  .btn{
    padding:13px 20px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;font-weight:700;font-size:15px;cursor:pointer;
    transition:all .2s;font-family:inherit;
    box-shadow:0 4px 15px rgba(99,102,241,.3);
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.4)}
  .btn:active{transform:translateY(0)}
  .btn-full{width:100%;margin-top:16px}
  .btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
  .btn-ghost{
    background:var(--bg);color:var(--text);box-shadow:none;
    border:1.5px solid var(--border);
  }
  .btn-ghost:hover{background:var(--border);box-shadow:none}
  .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow:0 4px 15px rgba(239,68,68,.3)}

  /* --- Результат --- */
  .result{text-align:center;padding:32px 20px}
  .result .em{font-size:72px;margin-bottom:8px;display:inline-block;
    animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .result h2{font-size:22px;margin-bottom:6px}
  .result p{color:var(--muted);margin-bottom:20px;font-size:14px}
  .result .stats-inline{display:flex;justify-content:center;gap:24px;margin-bottom:20px}
  .result .stats-inline div{text-align:center}
  .result .stats-inline b{font-size:22px;display:block;color:var(--primary)}
  .result .stats-inline small{font-size:11px;color:var(--muted);text-transform:uppercase}

  /* --- Level up modal --- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    z-index:200;animation:fadeIn .25s;padding:20px;
  }
  .overlay .modal{
    background:var(--card);border-radius:24px;padding:32px 24px;
    text-align:center;max-width:340px;width:100%;
    animation:pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  .overlay .modal .em{font-size:80px;margin-bottom:12px;
    display:inline-block;animation:breathe 1.5s infinite}
  .overlay .modal h3{font-size:20px;margin-bottom:6px;color:var(--primary)}
  .overlay .modal p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:20px}

  /* --- Пустое состояние --- */
  .empty{
    text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;
  }
  .empty .em{font-size:48px;margin-bottom:12px;opacity:.5;display:block}

  /* --- Настройки --- */
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;border-bottom:1px solid var(--border);
  }
  .setting-row:last-child{border-bottom:none}
  .setting-row .lbl{font-weight:600;font-size:14px}
  .setting-row .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .switch{
    width:46px;height:26px;border-radius:14px;background:var(--border);
    position:relative;cursor:pointer;transition:background .2s;border:none;
  }
  .switch.on{background:var(--primary)}
  .switch::after{
    content:'';position:absolute;top:3px;left:3px;
    width:20px;height:20px;border-radius:50%;background:#fff;
    transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .switch.on::after{transform:translateX(20px)}

  /* --- Прогресс по темам --- */
  .topic-progress{
    display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;
  }
  .topic-progress .dot{
    flex:1;min-width:20px;height:6px;border-radius:3px;background:var(--border);
  }
  .topic-progress .dot.done{background:var(--success)}

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .animal-grid{gap:8px}
    .animal-card{padding:14px}
    .animal-card .emoji{font-size:42px}
    .ach-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ ХЕДЕР ============ -->
  <div class="topbar" id="topbar" style="display:none">
    <div class="pet-mini" id="petMini">🐱</div>
    <div class="info">
      <div class="name" id="topName">Кот · Малыш</div>
      <div class="bar"><div id="topProgress"></div></div>
    </div>
    <div class="icons">
      <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
      <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
    </div>
  </div>

  <!-- ============ ЭКРАН: ВЫБОР ПИТОМЦА ============ -->
  <div id="screen-start" class="screen active">
    <div class="card">
      <h1>🐾 Выбери питомца</h1>
      <p class="sub">Он растёт вместе с твоими знаниями. Чем больше XP — тем сильнее и мудрее питомец.</p>
      <div class="animal-grid" id="animalGrid"></div>
    </div>
  </div>

  <!-- ============ ЭКРАН: ГЛАВНАЯ ============ -->
  <div id="screen-home" class="screen">
    <div class="pet-hero">
      <div class="pet-big" id="petBig">🐱</div>
      <div class="pet-info">
        <div class="pname" id="petName">Кот</div>
        <div class="pstage" id="petStage">Малыш</div>
        <div class="pbar"><div id="petProgress"></div></div>
        <div class="pxp" id="petXp">0 / 100 XP</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="em">🔥</span><b id="statStreak">0</b><small>стрик</small></div>
      <div class="stat"><span class="em">⭐</span><b id="statXp">0</b><small>XP</small></div>
      <div class="stat"><span class="em">📚</span><b id="statLessons">0</b><small>уроков</small></div>
      <div class="stat"><span class="em">🏆</span><b id="statAch">0</b><small>награды</small></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="lessons"><span>📚</span>Уроки</button>
      <button class="tab" data-tab="bilety"><span>📖</span>Билеты</button>
      <button class="tab" data-tab="exam"><span>⏱️</span>Экзамен</button>
      <button class="tab" data-tab="ach"><span>🏆</span>Награды</button>
      <button class="tab" data-tab="settings"><span>⚙️</span>Ещё</button>
    </div>

    <div id="tab-lessons" class="tab-content"></div>
    <div id="tab-bilety" class="tab-content" style="display:none"></div>
    <div id="tab-exam" class="tab-content" style="display:none"></div>
    <div id="tab-ach" class="tab-content" style="display:none"></div>
    <div id="tab-settings" class="tab-content" style="display:none"></div>
  </div>

  <!-- ============ ЭКРАН: КВИЗ ============ -->
  <div id="screen-quiz" class="screen">
    <div class="card">
      <div class="quiz-header">
        <button class="icon-btn" id="quizBack">←</button>
        <div class="bar"><div id="quizProgress"></div></div>
        <div class="cnt" id="quizCount">1/5</div>
      </div>
      <div class="quiz-q" id="quizQ">Вопрос</div>
      <div class="options" id="quizOptions"></div>
      <div class="explain hidden" id="quizExplain"></div>
      <button class="btn btn-full" id="quizNext" style="display:none">Далее →</button>
    </div>
  </div>

  <!-- ============ ЭКРАН: РЕЗУЛЬТАТ ============ -->
  <div id="screen-result" class="screen">
    <div class="card result">
      <div class="em" id="resultEm">🎉</div>
      <h2 id="resultTitle">Отлично!</h2>
      <p id="resultSub">Ты заработал +0 XP</p>
      <div class="stats-inline" id="resultStats"></div>
      <button class="btn btn-full" id="resultNext">Продолжить</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   ЖИВОТНЫЕ (6 штук, 5 стадий роста)

/* ============================================================
   КВИЗ: автогенерируется из билетов + доп. вопросы
   ============================================================ */
function buildQuizFromBilety() {
  const topics = {};
  BILETY.forEach(b => {
    b.blocks.forEach((blk, bi) => {
      // для некоторых блоков делаем вопросы с вариантами
      if (blk.type === 'Виды наук') {
        // парсим "почвоведение — естественная"
        blk.a.forEach(line => {
          const m = line.match(/^(.+?)\s*—\s*(.+)$/);
          if (!m) return;
          const science = m[1].trim();
          const correct = m[2].trim();
          if (!topics['sciences']) topics['sciences'] = { icon:'🔬', title:'Виды наук', lessons:[] };
          const allTypes = ['естественная','точная и техническая','социально-гуманитарная'];
          const opts = allTypes.map(t => t === correct ? correct : t);
          // перемешать
          const shuffled = [...opts].sort(() => Math.random() - 0.5);
          topics['sciences'].lessons.push({
            title: science,
            questions: [{
              q: `К какому виду наук относится «${science}»?`,
              options: shuffled.map(o => o.charAt(0).toUpperCase() + o.slice(1)),
              correct: shuffled.indexOf(correct),
              explain: `${science} — ${correct}.`
            }]
          });
        });
      }
    });
  });
  return topics;
}

const SCIENCES_QUIZ = buildQuizFromBilety();

  const today = new Date().toDateString();
  if (state.lastVisit === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();

  state.lastVisit = today;
  save();
}

/* ============================================================
   ЗВУКИ (Web Audio API — без файлов)
   ============================================================ */
let audioCtx = null;
function beep(freq, dur, type = 'sine', vol = 0.1, delay = 0) {
  if (!state.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
  } catch(e){}
}

function checkAchievements() {
  let unlockedNew = [];
  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements[a.id] && a.check(state)) {
      state.achievements[a.id] = Date.now();
      unlockedNew.push(a);
    }
  });
  if (unlockedNew.length) {
    save();
    setTimeout(() => {
      SFX.ach();
      showAchievementPopup(unlockedNew);
    }, 600);
  }
}

function showAchievementPopup(list) {
  const a = list[0];
  const div = document.createElement('div');
  div.className = 'overlay';
  div.innerHTML = `
    <div class="modal">
      <div class="em">${a.icon}</div>
      <h3>Достижение!</h3>
      <p><b>${a.title}</b><br>${a.desc}</p>
      <button class="btn btn-full" style="margin:0">Круто!</button>
    </div>`;
  div.querySelector('button').onclick = () => {
    div.remove();
    if (list.length > 1) showAchievementPopup(list.slice(1));
  };
  document.body.appendChild(div);
}

function renderAnimalChooser() {
  const grid = $('animalGrid');
  grid.innerHTML = '';
  Object.keys(ANIMALS).forEach(id => {
    const a = ANIMALS[id];
    const c = document.createElement('div');
    c.className = 'animal-card';
    c.innerHTML = `<span class="emoji">${a.emoji[0]}</span>
      <div class="name">${a.name}</div>
      <div class="desc">${a.desc}</div>`;
    c.onclick = () => {
      SFX.click();
      if (state.animalId && state.animalId !== id) state.petChanged = true;
      state.animalId = id;
      save();
      updateStreak();
      showScreen('home');
      renderHome();
    };
    grid.appendChild(c);
  });
}

/* ============================================================
   ГЛАВНАЯ
   ============================================================ */
function renderHome() {
  const a = getAnimal();
  if (!a) { showScreen('start'); return; }

  const stageIdx = getStage(state.xp);
  const stage = STAGES[stageIdx];
  const next = STAGES[stageIdx + 1];

  // питомец
  $('petBig').textContent = a.emoji[stageIdx];
  $('petBig').style.fontSize = (64 * stage.scale) + 'px';
  $('petName').textContent = a.name;
  $('petStage').textContent = 'Стадия: ' + stage.label;

  let pct = 100, xpText;
  if (next) {
    pct = Math.min(100, (state.xp - stage.xp) / (next.xp - stage.xp) * 100);
    xpText = `${state.xp} / ${next.xp} XP до «${next.label}»`;
  } else {
    xpText = `${state.xp} XP — максимум!`;
  }
  $('petProgress').style.width = pct + '%';
  $('petXp').textContent = xpText;

  // хедер
  $('petMini').textContent = a.emoji[stageIdx];
  $('topName').textContent = `${a.name} · ${stage.label}`;
  $('topProgress').style.width = pct + '%';

  // статистика
  $('statStreak').textContent = state.streak;
  $('statXp').textContent = state.xp;
  $('statLessons').textContent = Object.keys(state.completed).length;
  $('statAch').textContent = Object.keys(state.achievements).length;

  renderTab('lessons');
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    SFX.click();
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
    $('tab-' + t.dataset.tab).style.display = 'block';
    renderTab(t.dataset.tab);
  };
});

function renderTab(name) {
  if (name === 'lessons') renderLessons();
  else if (name === 'bilety') renderBilety();
  else if (name === 'exam') renderExamTab();
  else if (name === 'ach') renderAchievements();
  else if (name === 'settings') renderSettings();
}

function renderLessons() {
  const wrap = $('tab-lessons');
  wrap.innerHTML = '';
  TOPICS.forEach(topic => {
    const tEl = document.createElement('div');
    tEl.className = 'topic';
    const done = topic.lessons.filter((l, i) => state.completed[lessonKey(topic.id, i)] !== undefined).length;
    tEl.innerHTML = `
      <div class="topic-head">
        <span class="ic">${topic.icon}</span>
        <span class="tt">${topic.title}</span>
        <span class="cnt">${done}/${topic.lessons.length}</span>
      </div>
      <div class="lessons"></div>
      <div class="topic-progress"></div>
    `;
    const lessonsEl = tEl.querySelector('.lessons');
    const progEl = tEl.querySelector('.topic-progress');
    topic.lessons.forEach((lesson, idx) => {
      const key = lessonKey(topic.id, idx);
      const best = state.completed[key];
      const isDone = best !== undefined;
      const el = document.createElement('div');
      el.className = 'lesson' + (isDone ? ' done' : '');
      el.innerHTML = `
        <div class="lesson-num">${isDone ? '✓' : idx + 1}</div>
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-score">${isDone ? best + '/' + lesson.questions.length : ''}</div>
      `;
      el.onclick = () => { SFX.click(); startQuiz(topic, idx); };
      lessonsEl.appendChild(el);
      const dot = document.createElement('div');
      dot.className = 'dot' + (isDone ? ' done' : '');
      progEl.appendChild(dot);
    });
    wrap.appendChild(tEl);
  });

  // Науки (из билетов)
  const sciLessons = SCIENCES_QUIZ['sciences'];
  if (sciLessons) {
    const tEl = document.createElement('div');
    tEl.className = 'topic';
    const done = sciLessons.lessons.filter((l, i) => state.completed['sciences:' + i] !== undefined).length;
    tEl.innerHTML = `
      <div class="topic-head">
        <span class="ic">🔬</span>
        <span class="tt">Виды наук (из билетов)</span>
        <span class="cnt">${done}/${sciLessons.lessons.length}</span>
      </div>
      <div class="lessons"></div>
    `;
    const lessonsEl = tEl.querySelector('.lessons');
    sciLessons.lessons.forEach((lesson, idx) => {
      const key = 'sciences:' + idx;
      const best = state.completed[key];
      const isDone = best !== undefined;
      const el = document.createElement('div');
      el.className = 'lesson' + (isDone ? ' done' : '');
      el.innerHTML = `
        <div class="lesson-num">${isDone ? '✓' : idx + 1}</div>
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-score">${isDone ? best + '/1' : ''}</div>
      `;
      el.onclick = () => { SFX.click(); startQuizCustom('sciences', idx, lesson); };
      lessonsEl.appendChild(el);
    });
    wrap.appendChild(tEl);
  }
}

function renderBilety() {
  const wrap = $('tab-bilety');
  wrap.innerHTML = '';
  BILETY.forEach(b => {
    const viewed = state.viewedBilety[b.id];
    const card = document.createElement('div');
    card.className = 'bilet-card';
    card.innerHTML = `
      <div class="bilet-head">
        <h3>📖 ${b.title}</h3>
        <span class="badge ${viewed ? 'done' : ''}">${viewed ? '✓ прочитан' : b.blocks.length + ' блоков'}</span>
      </div>
      <div class="qa-list"></div>
    `;
    const qaList = card.querySelector('.qa-list');
    b.blocks.forEach((blk, i) => {
      const qa = document.createElement('div');
      qa.className = 'qa';
      qa.innerHTML = `
        <div class="q"><span class="num">${i + 1}</span> <span><b>${blk.type}:</b> ${blk.q}</span></div>
        <div class="a"><ul>${blk.a.map(x => '<li>' + x + '</li>').join('')}</ul></div>
        <button class="toggle-btn">Показать ответ</button>
      `;
      const ans = qa.querySelector('.a');
      const btn = qa.querySelector('.toggle-btn');
      btn.onclick = () => {
        SFX.click();
        ans.classList.toggle('show');
        btn.textContent = ans.classList.contains('show') ? 'Скрыть' : 'Показать ответ';
        if (ans.classList.contains('show') && !state.viewedBilety[b.id]) {
          state.viewedBilety[b.id] = true;
          save();
          checkAchievements();
          renderBilety();
        }
      };
      qaList.appendChild(qa);
    });
    wrap.appendChild(card);
  });
}

   ============================================================ */
function startQuiz(topic, lessonIdx) {
  const lesson = topic.lessons[lessonIdx];
  state.quiz = {
    topicId: topic.id,
    lessonIdx,
    questions: lesson.questions,
    current: 0,
    correct: 0,
    answered: false,
    lessonTitle: lesson.title
  };
  showScreen('quiz');
  renderQuestion();
}

function startQuizCustom(topicId, lessonIdx, lesson) {
  state.quiz = {
    topicId,
    lessonIdx,
    questions: lesson.questions,
    current: 0,
    correct: 0,
    answered: false,
    lessonTitle: lesson.title
  };
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = state.quiz;
  const question = q.questions[q.current];
  const total = q.questions.length;

  $('quizCount').textContent = (q.current + 1) + '/' + total;
  $('quizProgress').style.width = (q.current / total * 100) + '%';
  $('quizQ').textContent = question.q;

  const opts = $('quizOptions');
  opts.innerHTML = '';
  question.options.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = text;
    btn.onclick = () => answer(i);
    opts.appendChild(btn);
  });

  $('quizExplain').classList.add('hidden');
  $('quizNext').style.display = 'none';
  q.answered = false;
}

function answer(selected) {
  const q = state.quiz;
  if (q.answered) return;
  q.answered = true;

  const question = q.questions[q.current];
  const opts = document.querySelectorAll('#quizOptions .option');

  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === question.correct) btn.classList.add('correct');
    else if (i === selected) btn.classList.add('wrong');
  });

  if (selected === question.correct) {
    q.correct++;
    state.totalCorrect++;
    SFX.correct();
  } else {
    state.totalWrong++;
    SFX.wrong();
  }

  const ex = $('quizExplain');
  ex.textContent = '💡 ' + question.explain;
  ex.classList.remove('hidden');

  const next = $('quizNext');
  next.style.display = 'flex';
  next.textContent = (q.current === q.questions.length - 1) ? 'Завершить →' : 'Далее →';
  next.onclick = nextQuestion;
}

function nextQuestion() {
  const q = state.quiz;
  if (q.current < q.questions.length - 1) {
    q.current++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const q = state.quiz;
  const total = q.questions.length;
  const gainedXP = q.correct * 10;
  const oldStageIdx = getStage(state.xp);

  const key = lessonKey(q.topicId, q.lessonIdx);
  const prev = state.completed[key] || 0;
  if (q.correct > prev) {
    state.completed[key] = q.correct;
    if (q.correct === total) state.perfectOnce = true;
  }
  state.xp += gainedXP;
  save();

  const newStageIdx = getStage(state.xp);

  const pct = q.correct / total;
  let emoji = '🎉', title = 'Отлично!';
  if (pct < 0.5) { emoji = '😅'; title = 'Есть куда расти'; }
  else if (pct < 0.8) { emoji = '👍'; title = 'Хороший результат!'; }
  else if (pct === 1) { emoji = '🏆'; title = 'Идеально!'; }

  $('resultEm').textContent = emoji;
  $('resultTitle').textContent = title;
  $('resultSub').textContent = `${q.lessonTitle}`;
  $('resultStats').innerHTML = `
    <div><b>${q.correct}/${total}</b><small>верно</small></div>
    <div><b>+${gainedXP}</b><small>XP</small></div>
    <div><b>${state.streak}</b><small>стрик</small></div>
  `;
  SFX.finish();
  showScreen('result');
  checkAchievements();

  if (newStageIdx > oldStageIdx) {
    setTimeout(() => showLevelUp(newStageIdx), 700);
  }
}

function showLevelUp(stageIdx) {
  const a = getAnimal();
  const stage = STAGES[stageIdx];
  const div = document.createElement('div');
  div.className = 'overlay';
  div.innerHTML = `
    <div class="modal">
      <div class="em">${a.emoji[stageIdx]}</div>
      <h3>Новая стадия: ${stage.label}!</h3>
      <p>Твой ${a.name.toLowerCase()} подрос. Продолжай в том же духе!</p>
      <button class="btn btn-full" style="margin:0">Ура!</button>
    </div>`;
  div.querySelector('button').onclick = () => div.remove();
  document.body.appendChild(div);
  SFX.levelup();
}

/* ============================================================
   ЭКЗАМЕН (пробный режим с таймером)
   ============================================================ */
function renderExamTab() {
  const wrap = $('tab-exam');
  wrap.innerHTML = `
    <div class="card">
      <h2>⏱️ Пробный экзамен</h2>
      <p class="sub">10 случайных вопросов из всех тем. Таймер — 5 минут. Без подсказок.</p>
      <button class="btn btn-full" id="startExamBtn" style="margin:0">Начать экзамен</button>
    </div>
    <div class="card">
      <h2>📊 Твоя статистика</h2>
      <div class="stats" style="margin:0">
        <div class="stat"><span class="em">✅</span><b>${state.totalCorrect}</b><small>верных</small></div>
        <div class="stat"><span class="em">❌</span><b>${state.totalWrong}</b><small>ошибок</small></div>
        <div class="stat"><span class="em">🎯</span><b>${state.totalCorrect + state.totalWrong ? Math.round(state.totalCorrect / (state.totalCorrect + state.totalWrong) * 100) : 0}%</b><small>точность</small></div>
        <div class="stat"><span class="em">🔥</span><b>${state.streak}</b><small>стрик</small></div>
      </div>
    </div>
  `;
  $('startExamBtn').onclick = () => { SFX.click(); startExam(); };
}

function startExam() {
  // Собираем все вопросы
  const all = [];
  TOPICS.forEach(t => {
    t.lessons.forEach(l => {
      l.questions.forEach(q => all.push(q));
    });
  });
  // перемешать
  const shuffled = all.sort(() => Math.random() - 0.5).slice(0, 10);

  state.exam = {
    questions: shuffled,
    current: 0,
    correct: 0,
    answered: false,
    timeLeft: 300,
    timer: null,
    lessonTitle: 'Пробный экзамен'
  };

  // Используем экран квиза с таймером сверху
  const timerDiv = document.createElement('div');
  timerDiv.className = 'exam-timer';
  timerDiv.innerHTML = `<span>⏱️</span><span class="t" id="examTimer">05:00</span>`;
  const quizCard = $('screen-quiz').querySelector('.card');
  quizCard.insertBefore(timerDiv, quizCard.firstChild);

  showScreen('quiz');
  renderQuestion();

  state.exam.timer = setInterval(() => {
    state.exam.timeLeft--;
    const m = Math.floor(state.exam.timeLeft / 60);
    const s = state.exam.timeLeft % 60;
    const el = $('examTimer');
    if (!el) return;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (state.exam.timeLeft <= 60) el.classList.add('warn');
    if (state.exam.timeLeft <= 0) {
      clearInterval(state.exam.timer);
      finishExam(true);
    }
  }, 1000);
}

function finishExam(timeUp) {
  if (state.exam.timer) clearInterval(state.exam.timer);
  const q = state.exam;
  const total = q.questions.length;
  const gainedXP = q.correct * 15;

  state.xp += gainedXP;
  state.totalCorrect += q.correct;
  state.totalWrong += (q.current + 1) - q.correct;
  save();

  const timer = $('examTimer');
  if (timer) timer.parentElement.remove();

  const pct = q.correct / total;
  let emoji = '🎉', title = 'Экзамен сдан!';
  if (timeUp) { emoji = '⏰'; title = 'Время вышло!'; }
  else if (pct < 0.5) { emoji = '😅'; title = 'Пока слабовато'; }
  else if (pct < 0.8) { emoji = '👍'; title = 'Хороший результат!'; }
  else if (pct === 1) { emoji = '🏆'; title = 'Идеально!'; }

  $('resultEm').textContent = emoji;
  $('resultTitle').textContent = title;
  $('resultSub').textContent = `Пробный экзамен`;
  $('resultStats').innerHTML = `
    <div><b>${q.correct}/${total}</b><small>верно</small></div>
    <div><b>+${gainedXP}</b><small>XP</small></div>
    <div><b>${Math.round(pct * 100)}%</b><small>результат</small></div>
  `;
  SFX.finish();
  showScreen('result');
  checkAchievements();
}

/* ============================================================
   ДОСТИЖЕНИЯ
   ============================================================ */
function renderAchievements() {
  const wrap = $('tab-ach');
  const unlocked = Object.keys(state.achievements).length;
  wrap.innerHTML = `
    <div class="card">
      <h2>🏆 Достижения</h2>
      <p class="sub">Открыто ${unlocked} из ${ACHIEVEMENTS.length}</p>
      <div class="ach-grid" id="achGrid"></div>
    </div>
  `;
  const grid = $('achGrid');
  ACHIEVEMENTS.forEach(a => {
    const isUnlocked = !!state.achievements[a.id];
    const el = document.createElement('div');
    el.className = 'ach ' + (isUnlocked ? 'unlocked' : 'locked');
    el.innerHTML = `
      <div class="aic">${a.icon}</div>
      <div class="ainfo">
        <div class="atitle">${a.title}</div>
        <div class="adesc">${a.desc}</div>
      </div>
    `;
    grid.appendChild(el);
  });
}

/* ============================================================
   НАСТРОЙКИ
   ============================================================ */
function renderSettings() {
  const wrap = $('tab-settings');
  wrap.innerHTML = `
    <div class="card">
      <h2>⚙️ Настройки</h2>
      <div class="setting-row">
        <div>
          <div class="lbl">🔊 Звуки</div>
          <div class="sub">Клики, ответы, награды</div>
        </div>
        <button class="switch ${state.sound ? 'on' : ''}" id="setSound"></button>
      </div>
      <div class="setting-row">
        <div>
          <div class="lbl">🌙 Тёмная тема</div>
          <div class="sub">Для вечерних занятий</div>
        </div>
        <button class="switch ${state.theme === 'dark' ? 'on' : ''}" id="setTheme"></button>
      </div>
    </div>
    <div class="card">
      <h2>💾 Прогресс</h2>
      <p class="sub">Экспорт/импорт позволяет переносить прогресс между устройствами.</p>
      <button class="btn btn-ghost btn-full" id="exportBtn" style="margin-bottom:8px">📤 Экспорт прогресса</button>
      <label class="btn btn-ghost btn-full" style="cursor:pointer;margin-bottom:8px">
        📥 Импорт прогресса
        <input type="file" id="importFile" accept=".json" style="display:none">
      </label>
      <button class="btn btn-danger btn-full" id="resetBtn">🗑 Сбросить всё</button>
    </div>
    <div class="card">
      <h2>ℹ️ О приложении</h2>
      <p class="sub" style="margin:0">Тренажёр по блоку «Человек в обществе» для подготовки к ЕГЭ по обществознанию. Контент — 8 билетов + 5 тем + виды наук. Всего ${BILETY.reduce((n,b) => n + b.blocks.length, 0)} блоков теории.</p>
    </div>
  `;

  $('setSound').onclick = () => {
    state.sound = !state.sound;
    save();
    applySound();
    SFX.click();
    renderSettings();
  };
  $('setTheme').onclick = () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    save();
    applyTheme();
    SFX.click();
    renderSettings();
  };
  $('exportBtn').onclick = () => {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ege-progress-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    SFX.click();
  };
  $('importFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        state = Object.assign(state, data);
        save();
        applyTheme();
        applySound();
        renderHome();
        renderSettings();
        alert('Прогресс загружен!');
      } catch(err) {
        alert('Не удалось прочитать файл');
      }
    };
    reader.readAsText(file);
  };
  $('resetBtn').onclick = () => {
    if (confirm('Точно сбросить ВЕСЬ прогресс? Это нельзя отменить.')) {
      localStorage.removeItem(KEY);
      location.reload();
    }
  };
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
$('quizBack').onclick = () => {
  if (confirm('Выйти? Прогресс не сохранится.')) {
    if (state.exam && state.exam.timer) clearInterval(state.exam.timer);
    const timer = $('examTimer');
    if (timer) timer.parentElement.remove();
    state.exam = null;
    showScreen('home');
    renderHome();
  }
};
$('resultNext').onclick = () => {
  state.exam = null;
  showScreen('home');
  renderHome();
};
$('soundBtn').onclick = () => {
  state.sound = !state.sound;
  save(); applySound(); SFX.click();
};
$('themeBtn').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  save(); applyTheme(); SFX.click();
};

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init() {
  load();
  applyTheme();
  applySound();
  renderAnimalChooser();

  if (state.animalId && ANIMALS[state.animalId]) {
    updateStreak();
    showScreen('home');
    renderHome();
  } else {
    showScreen('start');
  }
}
init();
</script>
